# Triggering new deploy at: 2026-04-06 16:11:58
name: Deploy Kembar AI to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Auto-source profiles to get correct PATH for php, composer, npm
            [ -f ~/.profile ] && . ~/.profile
            [ -f ~/.bashrc ] && . ~/.bashrc
            
            # Setup error handling
            set -euo pipefail
            
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            REPO_URL="https://x-access-token:${{ github.token }}@github.com/ichzid/kembar-ai.git"

            # ── Validate required secrets ─────────────────────────────────
            if [ -z "$APP_DIR" ]; then
                echo "ERROR: VPS_APP_DIR secret is empty or not set!"
                echo "Please go to: GitHub Repo > Settings > Secrets and variables > Actions"
                echo "And add secret: VPS_APP_DIR = /path/to/your/app (e.g. /www/wwwroot/kembar-ai)"
                exit 1
            fi

            echo "APP_DIR is set to: $APP_DIR"

            echo "Ensuring application directory exists..."
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "Setting git safe directory..."
            git config --global --add safe.directory "$APP_DIR"

            echo "Checking if directory is a git repository..."
            if [ ! -d ".git" ]; then
                echo "Directory is not a git repository. Initializing clone..."
                # Move to parent directory and clone into APP_DIR
                cd ..
                # Remove APP_DIR if it exists and is empty or not git to avoid clone errors
                # But be careful not to delete files if there are any.
                # Just clone into a temporary and move if needed, OR just clone if empty.
                if [ -z "$(ls -A "$APP_DIR")" ]; then
                    rmdir "$APP_DIR"
                    git clone "$REPO_URL" "$APP_DIR"
                    cd "$APP_DIR"
                else
                    echo "Directory is not empty. Attempting to initialize git..."
                    cd "$APP_DIR"
                    git init
                    git remote add origin "$REPO_URL"
                    git fetch origin main
                    git checkout -f main
                fi
            else
                echo "Git repository found. Syncing with remote..."
                git fetch "$REPO_URL" main
                git reset --hard FETCH_HEAD
                git clean -fd
            fi

            echo "Checking environment..."
            php -v
            composer --version
            npm -v

            echo "Checking for artisan file..."
            if [ ! -f "artisan" ]; then
                echo "Error: artisan file not found in $APP_DIR"
                ls -la
                exit 1
            fi

            echo "Putting app into maintenance mode..."
            php artisan down --retry=60 || true

            echo "Installing PHP dependencies..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            echo "Installing and building frontend assets..."
            # Try npm ci, fall back to npm install if needed
            if [ -f package-lock.json ]; then
                npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            else
                npm install --legacy-peer-deps
            fi
            npm run build

            echo "Running migrations..."
            php artisan migrate --force

            echo "Managing Laravel caches..."
            php artisan optimize:clear
            php artisan optimize

            echo "Refreshing storage symlink..."
            php artisan storage:link || true

            echo "Restarting queue workers..."
            php artisan queue:restart || true

            echo "Fixing permissions (assuming www:www for aaPanel)..."
            # Attempt to fix permissions, ignore errors if not root
            sudo chown -R www:www "$APP_DIR" || chown -R www:www "$APP_DIR" || echo "Warning: Could not change ownership."
            sudo chmod -R 755 "$APP_DIR" || chmod -R 755 "$APP_DIR"
            sudo chmod -R 775 storage bootstrap/cache || chmod -R 775 storage bootstrap/cache

            echo "Bringing app back online..."
            php artisan up || true

            echo "Deploy finished successfully."