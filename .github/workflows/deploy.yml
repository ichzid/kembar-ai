name: Deploy Kembar AI to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Auto-source profiles to get correct PATH for php, composer, npm
            [ -f ~/.profile ] && . ~/.profile
            [ -f ~/.bashrc ] && . ~/.bashrc
            
            # Setup error handling
            set -euo pipefail
            
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            # Use github.token as it is built-in and valid during the run
            REPO_URL="https://x-access-token:${{ github.token }}@github.com/ichzid/kembar-ai.git"

            echo "Navigating to: $APP_DIR"
            cd "$APP_DIR"

            echo "Setting git safe directory..."
            git config --global --add safe.directory "$APP_DIR"

            echo "Checking environment..."
            php -v
            composer --version
            npm -v

            echo "Putting app into maintenance mode..."
            php artisan down --retry=60 || true

            echo "Pulling latest code from main branch..."
            git fetch "$REPO_URL" main
            git reset --hard FETCH_HEAD
            git clean -fd

            echo "Installing PHP dependencies..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            echo "Installing and building frontend assets..."
            # Try npm ci, fall back to npm install if needed
            if [ -f package-lock.json ]; then
                npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            else
                npm install --legacy-peer-deps
            fi
            npm run build

            echo "Running migrations..."
            php artisan migrate --force

            echo "Managing Laravel caches..."
            php artisan optimize:clear
            php artisan optimize

            echo "Refreshing storage symlink..."
            php artisan storage:link || true

            echo "Restarting queue workers..."
            php artisan queue:restart || true

            echo "Fixing permissions (assuming www:www for aaPanel)..."
            # Attempt to fix permissions, ignore errors if not root
            sudo chown -R www:www "$APP_DIR" || chown -R www:www "$APP_DIR" || echo "Warning: Could not change ownership."
            sudo chmod -R 755 "$APP_DIR" || chmod -R 755 "$APP_DIR"
            sudo chmod -R 775 storage bootstrap/cache || chmod -R 775 storage bootstrap/cache

            echo "Bringing app back online..."
            php artisan up || true

            echo "Deploy finished successfully."