name: Deploy Kembar AI to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ichzid/kembar-ai.git"

            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR"

            echo "Putting app into maintenance mode..."
            php artisan down --retry=60 || true

            echo "Pulling latest code..."
            git fetch "$REPO_URL" main
            git reset --hard FETCH_HEAD
            git clean -fd

            echo "Installing PHP dependencies..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            echo "Installing and building frontend assets..."
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            npm run build

            echo "Running migrations..."
            php artisan migrate --force

            echo "Clearing all Laravel caches..."
            php artisan optimize:clear
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan event:clear

            echo "Rebuilding Laravel caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan optimize

            echo "Refreshing storage symlink..."
            php artisan storage:link || true

            echo "Restarting queue workers..."
            php artisan queue:restart || true

            echo "Fixing permissions..."
            chown -R www:www "$APP_DIR"
            chmod -R 755 "$APP_DIR"
            chmod -R 775 storage bootstrap/cache

            echo "Bringing app back online..."
            php artisan up || true

            echo "Deploy finished successfully."